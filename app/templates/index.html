<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Waste Classification System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
    <div class="background-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-recycle"></i>
                    </div>
                    <div>
                        <h1 class="main-title">AI Waste Classification</h1>
                        <p class="subtitle">Intelligent Waste Management System</p>
                    </div>
                </div>
                <div class="datetime-display">
                    <div class="time" id="currentTime">00:00:00</div>
                    <div class="date" id="currentDate">Loading...</div>
                </div>
            </div>
        </header>

        <div class="main-grid">
            <!-- Video Feed Section -->
            <div class="glass-card video-section">
                <div class="card-header">
                    <h2><i class="fas fa-video"></i> Live Detection</h2>
                    <span class="status-badge live">
                        <span class="pulse-dot"></span>
                        LIVE
                    </span>
                </div>
                <div class="video-container">
                    <video id="videoFeed" class="video-feed" autoplay playsinline muted></video>
                    <canvas id="captureCanvas" style="display:none;"></canvas>
                </div>
                <div class="controls">
                    <div class="controls-row">
                        <button class="btn btn-danger" id="cameraToggleBtn" onclick="toggleCamera()">
                            <i class="fas fa-video-slash"></i> Stop Camera
                        </button>
                        <button class="btn btn-primary" onclick="captureImage()">
                            <i class="fas fa-camera"></i> Capture & Analyze
                        </button>
                        <button class="btn btn-secondary" onclick="uploadImage()">
                            <i class="fas fa-upload"></i> Upload
                        </button>
                    </div>

                    <input type="file" id="imageUpload" accept="image/*" hidden>
                </div>

                <div id="uploadedImageContainer"
                    style="display: none; margin-top: 20px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 20px;">
                    <div class="card-header" style="justify-content: center; margin-bottom: 15px;">
                        <h3><i class="fas fa-image"></i> Uploaded Image</h3>
                        <button onclick="closeUploadedImage()" class="btn btn-sm btn-outline-danger"
                            style="margin-left: 15px;">
                            <i class="fas fa-times"></i> Close
                        </button>
                    </div>
                    <img id="uploadedPredictionImage" src="" alt="Analyzed Upload"
                        style="max-width: 100%; max-height: 80vh; border-radius: 12px; border: 2px solid rgba(255, 255, 255, 0.2);">
                </div>
            </div>

            <!-- Results Section -->
            <div class="glass-card results-section">
                <div class="card-header">
                    <h2><i class="fas fa-chart-pie"></i> Detection Results</h2>
                </div>
                <div id="results" class="results-content">
                    <div class="waiting-state">
                        <div class="spinner"></div>
                        <p>Waiting for detection...</p>
                        <small>Point camera at waste or upload an image</small>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>© 2025 AI Waste Classification System | Powered by ResNet18 & PyTorch</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
